name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app-artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Upload production build
        id: build-artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app-dist
          path: apps/game/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAVITAS_SOFTWARE_GPU: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Download checked production build
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.app-artifact-id }}
          path: apps/game/dist
          merge-multiple: true
      - name: Test the downloaded build under /gravitas/
        run: npx playwright test --project=webgl2
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          retention-days: 7

  deploy:
    needs: [check, browser]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download browser-verified production build
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.app-artifact-id }}
          path: apps/game/dist
          merge-multiple: true
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: apps/game/dist
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
