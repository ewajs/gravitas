<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gravitas</title>
    <meta
      name="description"
      content="Posá un módulo lunar en la plataforma, con física real, en el navegador. Land a lunar module on the pad, with real physics, in your browser."
    />
    <!-- Icons from public/, generated by `npm run icons`; theme-color comes from the theme. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews need absolute URLs: the Pages deployment. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Gravitas" />
    <meta property="og:title" content="Gravitas" />
    <meta
      property="og:description"
      content="Posá un módulo lunar en la plataforma, con física real, en el navegador."
    />
    <meta property="og:url" content="https://ewajs.github.io/gravitas/" />
    <meta property="og:image" content="https://ewajs.github.io/gravitas/social.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Gravitas mark and name above a lunar horizon and landing pad."
    />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gravitas" />
    <meta
      name="twitter:description"
      content="Land a lunar module on the pad, with real physics, in your browser."
    />
    <meta name="twitter:image" content="https://ewajs.github.io/gravitas/social.png" />
    <meta
      name="twitter:image:alt"
      content="The Gravitas mark and name above a lunar horizon and landing pad."
    />
  </head>
  <body>
    <main>
      <div id="viewport"></div>
      <gravitas-flight-hud>
        <!-- Branding belongs to the app: the HUD shows these in its slots. -->
        <img slot="mark" src="/mark-small.svg" alt="" width="22" height="22" />
        <img slot="mark-large" src="/mark.svg" alt="" width="34" height="34" />
      </gravitas-flight-hud>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
